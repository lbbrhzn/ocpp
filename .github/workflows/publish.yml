name: Publish

on:
  release:
    types:
      - published
  push:
    branches:
      - main

jobs:
  release_zip_file:
    name: Publish zip file asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout the repository
        uses: actions/checkout@v7

      - name: 🛠️ Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.x"

      - name: 🔢 Get version
        id: version
        uses: home-assistant/actions/helpers/version@master

      - name: 🔢 Set version number
        env:
          # Passed via env, never interpolated into the shell source: the
          # release tag is attacker-influenceable and this job has
          # contents: write.
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          # Strip any leading v: the helper emits the tag verbatim, and
          # released zips have carried versions like "v0.11.2" as a result.
          python3 "$WORKSPACE/manage/update_manifest.py" --version "${RELEASE_VERSION#v}"

      - name: 📤 Upload zip to action
        uses: actions/upload-artifact@v7.0.1
        if: ${{ github.event_name == 'push' }}
        with:
          name: ocpp
          path: ${{ github.workspace }}/custom_components/ocpp

      # Pack the dir as a zip and upload to the release
      - name: 📦 ZIP Dir
        if: ${{ github.event_name == 'release' }}
        run: |
          cd ${{ github.workspace }}/custom_components/ocpp
          zip ocpp.zip -r ./

      - name: 📤 Upload zip to release
        uses: softprops/action-gh-release@v3
        if: ${{ github.event_name == 'release' }}
        with:
          files: ${{ github.workspace }}/custom_components/ocpp/ocpp.zip